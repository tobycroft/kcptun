# Dependabot PR 自动合并
#
# 触发方式（实测修正）：GitHub 在 Dependabot PR 的 check_run 事件上不会为本工作流创建运行
# （只有 master 自身推送的检查会触发），因此不能用 check_run 做触发；
# 改为 pull_request 事件触发 + 作业内轮询等待 CI 出结论，保证一定能跑到。
#   - 判定只看 CI 的 mod / build-test 两个检查（与 ci.yml 的 job 名严格对应）；
#   - 合并使用 squash；合并后为合并提交补打 dependencies / go 标签（squash 会丢标签），
#     供 Release 判断本次发布是否由依赖升级引起；
#   - 降级策略：CI 失败 / 等待超时 / 存在冲突 / 人工暂缓标签 → 保留 PR + 打 automerge-skip
#     标签 + 写明原因，绝不静默关闭，也绝不合并。
#
# 所需仓库设置见 .github/AUTOMATION.md（分支保护必需状态检查、可选 secret）。
name: Automerge Dependabot

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: 手动指定要评估的 Dependabot PR 编号（用于补跑/演练）
        required: true
        default: ''

permissions:
  contents: read
  pull-requests: write

concurrency:
  # 同一个 PR 串行处理，避免并发重复合并 / 重复打标签
  group: automerge-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  automerge:
    name: automerge
    # 只处理 Dependabot 开的 PR；其余 PR 直接跳过（省 runner）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      API: https://api.github.com/repos/${{ github.repository }}
      # 与 ci.yml 中的 job 名严格对应；这两项全绿才允许自动合并
      REQUIRED_CHECKS: mod build-test
      SKIP_LABEL: automerge-skip
      WAIT_MINUTES: 20
    steps:
      - name: Resolve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            if [ -z "${INPUT_PR}" ]; then
              echo "::error::workflow_dispatch 必须填写 pr_number"
              exit 1
            fi
            pr_number="${INPUT_PR}"
          else
            pr_number='${{ github.event.pull_request.number }}'
          fi

          pr_json="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"
          if [ "${author}" != "dependabot[bot]" ]; then
            echo "PR #${pr_number} 的提交者是 ${author}，不是 dependabot[bot]，不处理"
            echo "resolved=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          # 多行/特殊字符值统一用 GITHUB_ENV 的分隔写法，避免二次解析
          put() {
            {
              echo "$1<<__EOF__"
              echo "$2"
              echo __EOF__
            } >> "${GITHUB_ENV}"
          }

          put pr_number "${pr_number}"
          put author "${author}"
          put pr_title "$(jq -r '.title' <<<"${pr_json}")"
          put labels "$(jq -r '[.labels[].name] | join(" ")' <<<"${pr_json}")"
          put mergeable "$(jq -r '.mergeable' <<<"${pr_json}")"
          put mergeable_state "$(jq -r '.mergeable_state' <<<"${pr_json}")"
          put pr_base "$(jq -r '.base.ref' <<<"${pr_json}")"
          put pr_state "$(jq -r '.state' <<<"${pr_json}")"
          put pr_url "$(jq -r '.html_url' <<<"${pr_json}")"
          put head_sha "$(jq -r '.head.sha' <<<"${pr_json}")"
          put resolved "true"

      - name: Wait for CI (mod / build-test)
        if: env.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ci_conclusion() {
            jq -r --arg n "$1" \
              '[.[] | select(.name == $n)] | if length == 0 then "PENDING" else (sort_by(.id) | last | .conclusion // "null") end' \
              <<<"${checks}"
          }

          deadline=$((SECONDS + WAIT_MINUTES * 60))
          ci_timeout=false
          ci_results=''
          while :; do
            checks="$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs?per_page=100" \
              --jq '.check_runs')"
            pending=''
            ci_results=''
            for name in ${REQUIRED_CHECKS}; do
              conclusion="$(ci_conclusion "${name}")"
              ci_results="${ci_results} ${name}=${conclusion}"
              if [ "${conclusion}" = 'PENDING' ] || [ "${conclusion}" = 'null' ]; then
                pending="${pending} ${name}"
              fi
            done
            echo "已等 $((SECONDS))s：${ci_results}"
            if [ -z "${pending}" ]; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              ci_timeout=true
              echo "等待超时，未出结论的检查：${pending}"
              break
            fi
            sleep 20
          done

          {
            echo 'ci_results<<__EOF__'
            echo "${ci_results}"
            echo __EOF__
          } >> "${GITHUB_ENV}"
          echo "ci_timeout=${ci_timeout}" >> "${GITHUB_ENV}"

      - name: Evaluate gates (CI result / conflicts / labels)
        if: env.resolved == 'true'
        run: |
          set -euo pipefail

          skip() {
            echo "decision=skip" >> "${GITHUB_ENV}"
            {
              echo 'reason<<__EOF__'
              echo "$1"
              echo __EOF__
            } >> "${GITHUB_ENV}"
            echo "::notice::不自动合并：$1"
            exit 0
          }

          # 0) PR 已关闭/已合并：静默退出，不做任何评论与标签
          if [ "${pr_state}" != "open" ]; then
            echo "PR #${pr_number} 当前状态为 ${pr_state}，无需处理"
            exit 0
          fi

          # 1) 只处理主干分支上的依赖 PR
          if [ "${pr_base}" != "master" ]; then
            skip "PR #${pr_number} 的目标分支是 ${pr_base}，不是主干 master"
          fi

          # 2) 人工喊停：带上跳过标签就不再自动处理
          case " ${labels} " in
            *" ${SKIP_LABEL} "*|*" do-not-merge "*|*" hold "*)
              skip "PR 已带有表示人工暂缓的标签（${labels}）"
              ;;
          esac

          # 3) CI 结论：必需检查必须全部 success
          if [ -z "${ci_results}" ]; then
            skip "未取得任何 CI 结论（ci_results 为空），不做合并"
          fi
          if [ "${ci_timeout}" = "true" ]; then
            skip "等待 CI 结论超时（${WAIT_MINUTES} 分钟），当前状态：${ci_results}"
          fi
          for pair in ${ci_results}; do
            name="${pair%%=*}"
            conclusion="${pair#*=}"
            if [ "${conclusion}" != "success" ]; then
              skip "必需检查 ${name} 未通过（结论：${conclusion}）"
            fi
          done

          # 4) 冲突 / mergeable 状态（GitHub 异步计算，重试若干次）
          attempt=0
          while [ "${mergeable}" != "true" ] && [ "${attempt}" -lt 6 ]; do
            attempt=$((attempt + 1))
            mergeable_now="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.mergeable')"
            mergeable_state="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.mergeable_state')"
            mergeable="${mergeable_now}"
            if [ "${mergeable}" = "null" ] || [ -z "${mergeable}" ]; then
              sleep 5
            fi
          done
          if [ "${mergeable}" != "true" ]; then
            skip "PR 当前不可合并（mergeable=${mergeable}, state=${mergeable_state}），可能存在冲突"
          fi

          echo "decision=merge" >> "${GITHUB_ENV}"
          echo "CI 结论全部通过：${ci_results}"

      - name: Ensure labels exist
        if: env.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          create_label() {
            local name="$1" color="$2" desc="$3" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${API}/labels" \
              -d "{\"name\":\"${name}\",\"color\":\"${color}\",\"description\":\"${desc}\"}")"
            echo "label ${name}: HTTP ${code}"
          }
          create_label "${SKIP_LABEL}" 'B60200' 'Dependabot PR 未满足自动合并条件，需人工处理'
          create_label 'dependencies' '0366d6' 'Pull requests that update a dependency file'
          create_label 'go' '16e2e2' 'Pull requests that update go code'

      - name: Approve pull request
        if: env.decision == 'merge'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          # 优先用独立账号 / PAT 完成 approve（分支保护要求 approval 时必须有；
          # GITHUB_TOKEN 无法 approve 自己触发的 PR，属已知平台限制）。
          # 未配置 AUTOMERGE_TOKEN 时跳过 approve：分支保护未强制 approval 也能正常合并。
          if [ -z "${GH_TOKEN}" ]; then
            echo "未配置 secrets.AUTOMERGE_TOKEN，跳过显式 approve（如分支保护要求 approval，请配置该 secret）"
            exit 0
          fi
          gh pr review "${pr_number}" --repo "${{ github.repository }}" --approve \
            --body '自动检查通过（CI: mod / build-test 全绿，无冲突），自动批准合并。'

      - name: Merge with squash
        if: env.decision == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${pr_number}" --repo "${{ github.repository }}" \
            --squash --delete-branch \
            --subject "chore(deps): ${pr_title} (#${pr_number})"
          echo "merged=true" >> "${GITHUB_ENV}"

      - name: Restore labels after squash merge
        if: env.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # squash 合并会丢弃 PR 标签，这里补回，供 Release 判定依赖升级来源
          merge_sha="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.merge_commit_sha')"
          curl -sS -o /dev/null -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${API}/commits/${merge_sha}/labels" \
            -d '{"labels":["dependencies","go"]}'
          echo "已为合并提交 ${merge_sha} 补打 dependencies / go 标签"

      - name: Report skip (keep PR open)
        if: env.decision == 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "保留 PR #${pr_number} 不做自动合并：${reason}"
          gh pr edit "${pr_number}" --repo "${{ github.repository }}" --add-label "${SKIP_LABEL}" || true
          body="### 自动合并已跳过

          本 PR 保持打开，等待人工处理。原因：

          > ${reason}

          排查建议见 [.github/AUTOMATION.md](https://github.com/${{ github.repository }}/blob/master/.github/AUTOMATION.md)。
          处理完成后移除 \`automerge-skip\` 标签，再用本工作流手动补跑（填 PR 编号）或推送新提交重新触发。"
          gh pr comment "${pr_number}" --repo "${{ github.repository }}" --body-file - <<<"${body}"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Automerge 评估结果'
            echo ''
            echo "- PR：#${pr_number:-未识别} ${{ env.pr_title }}"
            echo "- 决定：${decision:-未处理（非 Dependabot PR 或无关联 PR）}"
            echo "- CI 结论：${ci_results:-无}"
            echo "- 跳过原因：${reason:-无}"
          } >> "${GITHUB_STEP_SUMMARY}"
