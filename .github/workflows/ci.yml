# CI：编译 + 静态检查 + 测试
#
# 本工作流的两个 job 名（mod / build-test）就是分支保护里要登记的
# 必需状态检查（required status checks），名字请勿随意改动。
# 它同时也是 automerge-dependabot.yml 的放行条件。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- go.mod / go.sum 一致性 ----------
  mod:
    name: mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 go 指令保持一致（发布用工具链版本见 release.yml 的注释）
          go-version: '1.27.3'
          check-latest: false

      - name: Verify go.mod / go.sum are tidy
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod / go.sum 与源码不同步，请在本地执行 'go mod tidy' 后提交"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

  # ---------- 编译 + 静态检查 + 测试 ----------
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::以下文件未通过 gofmt 检查："
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Build (client & server)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o /tmp/client ./client
          CGO_ENABLED=0 go build -trimpath -o /tmp/server ./server

      - name: Test
        run: go test -timeout 10m -v ./...
